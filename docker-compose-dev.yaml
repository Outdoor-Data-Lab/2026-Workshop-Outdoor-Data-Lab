services:
  taxhub:
    restart: "no"
    command:
      - /bin/sh
      - -ec
      - |
        flask db upgrade taxhub-standalone@head -x local-srid=2154
        flask db upgrade ref_geo_fr_departments@head
        flask db upgrade ref_geo_fr_municipalities@head
        flask db upgrade ref_geo_inpn_grids_1@head
        flask db autoupgrade
        # Import TaxRef v18 only if it is not already loaded (no psql in this image).
        if python -c "import os, sys, sqlalchemy as sa; e = sa.create_engine(os.environ['TAXHUB_SQLALCHEMY_DATABASE_URI']); c = e.connect(); sys.exit(0 if c.execute(sa.text('select 1 from taxonomie.t_meta_taxref tmt where tmt.version = 18')).first() else 1)"; then
          echo "TaxRef v18 already imported, skipping"
        else
          flask taxref import-v18 --taxref-region=fr
        fi

    environment:
      FLASK_APP: apptax.app:create_app
      FLASK_DEBUG: "1"
      TAXHUB_SQLALCHEMY_DATABASE_URI: postgresql://postgres:password@db:5432/myapp
      TAXHUB_CONFIG_FILE: ""
      TAXHUB_SECRET_KEY: dev-only-secret-key-for-migrations
    image: lpoaura/taxhub:dev
    depends_on:
      db:
        condition: service_healthy
        required: true
  web:
    build:
      context: .
      # Build the development stage from the multi-stage Dockerfile.
      target: development
    ports:
      - "8000:8000"
    environment:
      # Enable Django's verbose debug error pages (the dev server always auto-reloads).
      - DEBUG=1
      # Database connection settings passed to Django via environment variables.
      - POSTGRES_DB=myapp
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      # Uploaded files (data imports), kept in the media-data volume.
      - MEDIA_ROOT=/app/media
    volumes:
      # Persist uploaded files across container rebuilds.
      - media-data:/app/media
    # Wait for the database to pass its healthcheck before starting the web service.
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        # Sync source file changes directly into the container so Django's
        # dev server can reload them without a full image rebuild.
        - action: sync
          path: .
          target: /app
          ignore:
            - __pycache__/
            - "*.pyc"
            - .git/
            - .venv/
            - db-data/
        # Rebuild the image when dependencies change.
        - action: rebuild
          path: pyproject.toml
        - action: rebuild
          path: uv.lock
  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "5173:5173"
    depends_on:
      - web
    develop:
      watch:
        # Sync source changes so Vite's HMR picks them up.
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/
            - dist/
        # Rebuild the image when dependencies change.
        - action: rebuild
          path: ./frontend/package.json
  db:
    image: postgis/postgis:18-3.7
    restart: always
    volumes:
      # Persist database data across container restarts.
      - ./db-data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-taxhub-extensions.sql:ro
    environment:
      - POSTGRES_DB=myapp
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    # Expose the port only to other services on the Compose network,
    # not to the host machine.
    expose:
      - 5432
    healthcheck:
      # Healthy only once the ready server also has all required extensions.
      test:
        - CMD-SHELL
        - >-
          pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} &&
          [ "$$(psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -tAc
          "SELECT count(*) FROM pg_extension WHERE extname IN
          ('pg_trgm','uuid-ossp','ltree','postgis','postgis_raster','unaccent')")" = 6 ]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  db-data:
  media-data:
