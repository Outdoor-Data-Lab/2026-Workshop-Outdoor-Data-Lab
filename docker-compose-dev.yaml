# Development overrides, applied on top of docker-compose.yaml.
# Enabled with COMPOSE_FILE=docker-compose.yaml:docker-compose-dev.yaml in .env

services:
  taxhub:
    environment:
      FLASK_DEBUG: "1"

  web:
    build:
      target: development
    ports:
      - "8000:8000"
    environment:
      # Verbose error pages and the debug toolbar.
      DEBUG: "1"
    develop:
      watch:
        # Sync source file changes directly into the container so Django's
        # dev server can reload them without a full image rebuild.
        - action: sync
          path: .
          target: /app
          ignore:
            - __pycache__/
            - "*.pyc"
            - .git/
            - .venv/
            - db-data/
        # Rebuild the image when dependencies change.
        - action: rebuild
          path: pyproject.toml
        - action: rebuild
          path: uv.lock

  frontend:
    build:
      target: development
    ports:
      - "5173:5173"
    environment:
      - API_PROXY_TARGET=http://web:8000
    develop:
      watch:
        # Sync source changes so Vite's HMR picks them up.
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/
            - dist/
        # Rebuild the image when dependencies change.
        - action: rebuild
          path: ./frontend/package.json
