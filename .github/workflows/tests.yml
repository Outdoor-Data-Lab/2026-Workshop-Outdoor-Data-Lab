name: Django tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    # Margin for a run without cache (first run, new version).
    timeout-minutes: 20

    services:
      db:
        image: postgis/postgis:18-3.7
        env:
          POSTGRES_DB: myapp
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_DB: myapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      # GeoDjango needs the GDAL/GEOS/PROJ shared libraries. Cached: the Ubuntu
      # mirror sometimes serves these 72 MB at under 100 kB/s.
      - name: Install system libraries
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: gdal-bin libgdal-dev libgeos-dev libproj-dev
          # Bump to refresh the cache.
          version: 2
          # Runs ldconfig, so that Django finds libgdal and libgeos_c.
          execute_install_scripts: true

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        working-directory: backend
        run: uv run python manage.py test --noinput
