site_name: OutdoorDataLab
site_description: Documentation for the OutdoorDataLab application
site_url: https://outdoor-data-lab.github.io/2026-Workshop-Outdoor-Data-Lab/
repo_name: Outdoor-Data-Lab/2026-Workshop-Outdoor-Data-Lab
repo_url: https://github.com/Outdoor-Data-Lab/2026-Workshop-Outdoor-Data-Lab
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation: install.md
  - Data:
      - Importing data: imports.md
      - External layers: external-layers.md
      - Layer order: layer-order.md
