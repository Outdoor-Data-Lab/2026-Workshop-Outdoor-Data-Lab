# Production overrides, applied on top of docker-compose.yaml.
# Enabled with COMPOSE_FILE=docker-compose.yaml:docker-compose-prod.yaml in .env
#
# Traefik terminates HTTPS (Let's Encrypt certificate) for ${DOMAIN}:
#   /api, /admin, /static -> web (Django + Gunicorn)
#   everything else       -> frontend (nginx serving the Vue build)
# Only ports 80 and 443 are open on the host.

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    logging: *logging
    command:
      - --providers.docker=true
      # Only containers with traefik.enable=true are exposed.
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?ACME_EMAIL must be set in .env}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
      - --accesslog=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

  db:
    logging: *logging

  taxhub:
    logging: *logging

  web:
    build:
      target: production
    restart: unless-stopped
    logging: *logging
    environment:
      DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DOMAIN:?DOMAIN must be set in .env}
      DJANGO_CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
      # Number of Gunicorn workers (read natively by Gunicorn).
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
      # Additional Gunicorn settings. Explicit options here override native
      # defaults such as WEB_CONCURRENCY when the same setting is specified.
      GUNICORN_CMD_ARGS: >-
        ${GUNICORN_CMD_ARGS:---threads 2 --timeout 120 --graceful-timeout 30
        --max-requests 1000 --max-requests-jitter 100}
    command:
      - /bin/sh
      - -ec
      - |
        python backend/manage.py migrate --noinput
        exec gunicorn --chdir backend --bind 0.0.0.0:8000 workshop2026.wsgi:application
    depends_on:
      # Django tables reference the TaxHub / ref_geo schemas.
      taxhub:
        condition: service_completed_successfully
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`${DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/admin`) || PathPrefix(`/static`))
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.services.web.loadbalancer.server.port=8000

  frontend:
    build:
      target: production
    restart: unless-stopped
    logging: *logging
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.services.frontend.loadbalancer.server.port=80

volumes:
  letsencrypt:
