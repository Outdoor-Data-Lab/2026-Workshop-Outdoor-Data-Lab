# Base stack, shared by every environment.
# Do not use alone: chain it with an override through COMPOSE_FILE in .env
#   dev : COMPOSE_FILE=docker-compose.yaml:docker-compose-dev.yaml
#   prod: COMPOSE_FILE=docker-compose.yaml:docker-compose-prod.yaml

x-db-env: &db-env
  POSTGRES_DB: ${POSTGRES_DB:-myapp}
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}

services:
  db:
    image: postgis/postgis:18-3.7
    restart: unless-stopped
    environment:
      <<: *db-env
    volumes:
      - db-data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-taxhub-extensions.sql:ro
    # Reachable only from the Compose network, not from the host.
    expose:
      - 5432
    healthcheck:
      # Healthy only once the ready server also has all required extensions.
      test:
        - CMD-SHELL
        - >-
          pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} &&
          [ "$$(psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -tAc
          "SELECT count(*) FROM pg_extension WHERE extname IN
          ('pg_trgm','uuid-ossp','ltree','postgis','postgis_raster','unaccent')")" = 6 ]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot job: creates the TaxHub / ref_geo schemas and imports TaxRef.
  taxhub:
    image: ${TAXHUB_IMAGE:-lpoaura/taxhub:dev}
    restart: "no"
    command:
      - /bin/sh
      - -ec
      - |
        flask db upgrade taxhub-standalone@head -x local-srid=2154
        flask db upgrade ref_geo_fr_departments@head
        flask db upgrade ref_geo_fr_municipalities@head
        flask db upgrade ref_geo_inpn_grids_1@head
        flask db autoupgrade
        # Import TaxRef v18 only if it is not already loaded (no psql in this image).
        if python -c "import os, sys, sqlalchemy as sa; e = sa.create_engine(os.environ['TAXHUB_SQLALCHEMY_DATABASE_URI']); c = e.connect(); sys.exit(0 if c.execute(sa.text('select 1 from taxonomie.t_meta_taxref tmt where tmt.version = 18')).first() else 1)"; then
          echo "TaxRef v18 already imported, skipping"
        else
          flask taxref import-v18 --taxref-region=fr
        fi
    environment:
      FLASK_APP: apptax.app:create_app
      TAXHUB_SQLALCHEMY_DATABASE_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-myapp}
      TAXHUB_CONFIG_FILE: ""
      TAXHUB_SECRET_KEY: ${TAXHUB_SECRET_KEY:?TAXHUB_SECRET_KEY must be set in .env}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
    environment:
      <<: *db-env
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set in .env}
      # Uploaded files (data imports), kept in the media-data volume.
      MEDIA_ROOT: /app/media
    volumes:
      - media-data:/app/media
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    depends_on:
      - web

volumes:
  db-data:
  media-data:
